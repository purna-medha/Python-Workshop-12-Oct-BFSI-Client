[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-pico-zon"
version = "0.1.0"
description = "A tiny modular shopping application for Python teaching"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "requests>=2.32,<3"]
web = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
include = ["pico_zon*"]
